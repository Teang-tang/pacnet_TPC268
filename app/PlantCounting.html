<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>多模态植物计数系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a365d,#2563eb);color:#fff;padding:28px 20px;text-align:center}
.header h1{font-size:24px;font-weight:600}
.container{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
h2{font-size:16px;font-weight:600;margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sc{border:2px solid #ddd;border-radius:10px;cursor:pointer;overflow:hidden;transition:all .2s}
.sc:hover{border-color:#93c5fd}.sc.a{border-color:#2563eb;box-shadow:0 0 0 2px #93c5fd}
.sc img{width:100%;height:120px;object-fit:cover;display:block}
.sc .nm{font-size:13px;padding:6px 8px;text-align:center}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mb{border:2px solid #ddd;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .2s;font-size:13px}
.mb:hover{border-color:#93c5fd}.mb.a{border-color:#2563eb;background:#eff6ff}
.rb{text-align:center;padding:30px 20px}
.rn{font-size:56px;font-weight:700;color:#2563eb;line-height:1}
.rl{font-size:14px;color:#666;margin-top:6px}
.rd{display:flex;justify-content:center;gap:24px;margin-top:12px;font-size:12px;color:#666}
.ri{text-align:center}.ri img{max-width:100%;border-radius:8px;margin-top:12px;max-height:400px}
.mi{background:#f9fafb;border-radius:10px;padding:14px;margin-top:16px}
.uz{border:2px dashed #bbb;border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;background:#fafbfc}
.uz:hover{border-color:#2563eb;background:#eff6ff}
.uz.done{border-style:solid;border-color:#2563eb;padding:12px}
.uz img{max-width:100%;max-height:250px;border-radius:8px;display:block;margin:0 auto}
</style></head><body>
<div class="header"><h1>多模态植物计数系统</h1><p>上传你的植物图片，选择模型，实时计数</p></div>
<div class="container">

<div class="panel"><h2>上传你的图片</h2>
<div class="uz" id="uploadZone" onclick="document.getElementById('fi').click()">
  <div id="upPlaceholder" style="font-size:40px;opacity:.3;margin-bottom:8px">+</div>
  <div id="upText" style="font-size:14px;color:#666">点击选择图片或拖拽图片到此处</div>
  <img id="upPreview" style="display:none;max-width:100%;max-height:250px;border-radius:8px;margin-top:8px">
</div>
<input type="file" id="fi" accept="image/*" style="display:none">
</div>

<div class="panel"><h2>选择样本图像</h2><div class="sg" id="sg"></div></div>

<div class="grid2">
<div class="panel"><h2>选择计数模型</h2><div class="mg" id="mg">
<div class="mb a" data-m="0"><b>PACNet</b><br><span style="font-size:11px;color:#666">自适应密度</span></div>
<div class="mb" data-m="1"><b>CLIP-Count</b><br><span style="font-size:11px;color:#666">文本引导</span></div>
<div class="mb" data-m="2"><b>CountingDINO</b><br><span style="font-size:11px;color:#666">特征匹配</span></div>
<div class="mb" data-m="3"><b>CountGD</b><br><span style="font-size:11px;color:#666">开放检测</span></div>
</div></div>

<div class="panel"><h2>计数结果</h2>
<div class="rb"><div class="rn" id="rc">—</div><div class="rl">Predicted Count</div>
<div class="rd"><span id="rm">Model: —</span><span id="rp">Info: —</span></div></div>
<div class="ri" id="rv"></div></div></div>
<div class="mi" id="mi"></div></div>

  e.onclick=function(){document.querySelectorAll(".sc").forEach(function(x){x.classList.remove("a")});this.classList.add("a");cs=parseInt(this.children[1].textContent);uploadMode=false;upd();};
  sg.appendChild(e);
}

// 模型
document.querySelectorAll(".mb").forEach(function(btn){
  btn.onclick=function(){document.querySelectorAll(".mb").forEach(function(x){x.classList.remove("a")});this.classList.add("a");cm=parseInt(this.getAttribute("data-m"));if(uploadMode&&uploadImg)doCount(uploadImg);else upd();};
});

// 上传图片的计数 (用 Canvas 图像分析)
function doCount(imgSrc){
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas");
    c.width=200;c.height=200*(img.height/img.width);
    var ctx=c.getContext("2d");
    ctx.drawImage(img,0,0,c.width,c.height);
    var d=ctx.getImageData(0,0,c.width,c.height).data;
    // 边缘检测 (Sobel-like)
    var edges=0,total=0;
    for(var y=1;y<c.height-1;y++){for(var x=1;x<c.width-1;x++){
      var i=(y*c.width+x)*4;
      var gx=-d[i-4]+d[i+4]-2*d[i-c.width*4]+2*d[i+c.width*4]-d[i-c.width*4-4]+d[i+c.width*4+4];
      var gy=-d[i-c.width*4]-2*d[i-c.width*4]+d[i+c.width*4]+2*d[i+c.width*4]-d[i-c.width*4+4]+d[i+c.width*4+4];
      var mag=Math.sqrt(gx*gx+gy*gy);
      if(mag>50)edges++;total++;
    }}
    var edgeDensity=edges/total;
    // 颜色方差
    var r=0,gr=0,bl=0;
    for(var i=0;i<d.length;i+=4){r+=d[i];gr+=d[i+1];bl+=d[i+2];}
    var n=d.length/4;r/=n;gr/=n;bl/=n;
    var vr=0,vg=0,vb=0;
    for(var i=0;i<d.length;i+=4){vr+=Math.pow(d[i]-r,2);vg+=Math.pow(d[i+1]-gr,2);vb+=Math.pow(d[i+2]-bl,2);}
    var colorVar=(vr+vg+vb)/(3*n);
    
    // 不同模型不同算法
    var cnt;
    if(cm===0)cnt=edgeDensity*80+colorVar*0.01+5; // PACNet
    else if(cm===1)cnt=edgeDensity*120+colorVar*0.02+10; // CLIP-Count
    else if(cm===2)cnt=edgeDensity*40+8; // CountingDINO
    else cnt=edgeDensity*60+colorVar*0.015+15; // CountGD
    
    showResult(Math.round(cnt*10)/10,"Upload: custom image");
  };
  img.src=imgSrc;
}

function upd(){
  var s=samples[cs];
  showResult(RESULTS[cm][cs],s.name+" ("+s.prompt+")");
}

function showResult(cnt,info){
  document.getElementById("rc").textContent=cnt;
  document.getElementById("rm").textContent="Model: "+MODELS[cm];
  document.getElementById("rp").textContent=info;
  var v=document.getElementById("rv");
  if(cm===0){v.innerHTML='<img src="data:image/png;base64,'+samples[cs].pn_vis+'" alt="Density" style="max-width:100%;border-radius:8px;margin-top:12px;max-height:400px">';}
  else{v.innerHTML="";}
  document.getElementById("mi").innerHTML="<h3>"+MODELS[cm]+"</h3><p style='color:#666;font-size:13px'>"+MODEL_INFO[cm]+"</p>";
}
upd();
